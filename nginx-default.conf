# Nginx config for api.soseemless.com with SSL (Let's Encrypt)
# 1. Install certbot and get cert (see instructions below)
# 2. Replace /etc/nginx/sites-available/default with this file
# 3. sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.soseemless.com;
    location / {
        return 301 https://$host$request_uri;
    }
    # Used by Certbot for HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
}

# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name api.soseemless.com;

    # Let's Encrypt (created by Certbot)
    ssl_certificate     /etc/letsencrypt/live/api.soseemless.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.soseemless.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
