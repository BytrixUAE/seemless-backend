# Build and push backend image to Docker Hub on push to main
# Repo root = seemless_backend (Dockerfile, package.json, app/, etc.)
name: Build and push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allows manual run from Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Confirm repo root has Dockerfile (no seemless_backend subfolder)
      - name: Verify build context
        run: |
          ls -la
          test -f Dockerfile || (echo "ERROR: Dockerfile not at root" && exit 1)
          test -f package.json || (echo "ERROR: package.json not at root" && exit 1)

      # Bake the production .env into the image (Dockerfile COPYs it in; the app
      # reads it via dotenv at runtime). .env is gitignored, so without this step
      # the image ships with .env.example instead and is missing every real secret.
      #
      # The secret MUST be passed through `env:` and referenced as "$ENV_FILE" here,
      # not interpolated as ${{ secrets.ENV_FILE }} directly into `run:` — that pastes
      # the secret as raw script text, so bash then parses its own quotes/backslashes
      # and corrupts SERVICE_ACCOUNT's embedded JSON/private key.
      #
      # NOTE: secrets end up inside the image layers -> keep abdullah211/soseemless
      # on Docker Hub PRIVATE.
      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            abdullah211/soseemless:latest
            abdullah211/soseemless:${{ github.sha }}