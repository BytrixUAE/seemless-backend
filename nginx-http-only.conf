# Use this FIRST so Certbot can get the cert. Then run: sudo certbot --nginx -d api.soseemless.com
# Certbot will add the HTTPS server block automatically.
# Replace /etc/nginx/sites-available/default with this, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name api.soseemless.com;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
